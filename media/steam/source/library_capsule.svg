        <rect x="-126.0" y="-30.0" width="252.0" height="60.0" rx="9.0" fill="#F4BF3A"/>
        <g stroke="#111827" stroke-width="4.8">
          <path d="M -96.0 -30.0 V 6.0"/>
          <path d="M -48.0 -30.0 V 12.0"/>
          <path d="M 0 -30.0 V 6.0"/>
          <path d="M 48.0 -30.0 V 12.0"/>
        </g>
      </g>
    </g>


    <g transform="translate(252.0 522.0) rotate(-28.0)" filter="url(#shadow)">
