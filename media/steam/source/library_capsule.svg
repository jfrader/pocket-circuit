<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">

    <defs>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#111827"/>
        <stop offset="0.56" stop-color="#19243B"/>
        <stop offset="1" stop-color="#273855"/>
      </linearGradient>
      <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#111827" stop-opacity="0.98"/>
        <stop offset="0.68" stop-color="#111827" stop-opacity="0.72"/>
        <stop offset="1" stop-color="#111827" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="titleFadeVertical" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="0.68" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#000000"/>
      </linearGradient>
      <mask id="titleMask"><rect width="100%" height="100%" fill="url(#titleFadeVertical)"/></mask>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#FFE7A0" stop-opacity="0.95"/>
        <stop offset="0.55" stop-color="#F4BF3A" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#F4BF3A" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
        <feOffset dx="0" dy="12" result="offsetblur"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
      </pattern>
    </defs>

    <rect width="600" height="900" fill="url(#night)"/>
    <rect width="600" height="900" fill="url(#grid)"/>
    <circle cx="504.0" cy="18.0" r="330.0" fill="url(#sun)"/>
    <path d="M 108.0 1008.0 C 30.0 702.0, 492.0 648.0, 372.0 378.0 S 216.0 18.0, 468.0 -90.0" fill="none" stroke="#0B1220" stroke-width="192.0" stroke-linecap="round"/>
    <path d="M 108.0 1008.0 C 30.0 702.0, 492.0 648.0, 372.0 378.0 S 216.0 18.0, 468.0 -90.0" fill="none" stroke="#F4E8D0" stroke-width="150.0" stroke-linecap="round"/>
    <path d="M 108.0 1008.0 C 30.0 702.0, 492.0 648.0, 372.0 378.0 S 216.0 18.0, 468.0 -90.0" fill="none" stroke="#E96B4C" stroke-width="10.8" stroke-dasharray="33.0 27.0" stroke-linecap="round"/>

    <g opacity="0.95">
