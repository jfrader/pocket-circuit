      <path d="M -29.3 -40.3 Q 0 -77.0 29.3 -40.3 L 21.7 14.7 L -21.7 14.7 Z" fill="#55A8C9" stroke="#111827" stroke-width="4.2"/>
      <rect x="-6.0" y="-102.7" width="11.9" height="192.5" rx="5.4" fill="#F4BF3A"/>
      <circle cx="-26.0" cy="-88.0" r="8.7" fill="#FFF8E8"/>
