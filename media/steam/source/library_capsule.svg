    <rect x="0" y="0" width="516.0" height="306.0" fill="url(#titleFade)" mask="url(#titleMask)"/>

    <g transform="translate(48.0 126.0)">
      <rect x="0" y="-46.2" width="12.0" height="12.0" rx="2.4" fill="#F4BF3A" transform="rotate(45 6.0 -40.2)"/>
      <text x="18.0" y="0" fill="#FFF8E8" stroke="#111827" stroke-width="2.1" paint-order="stroke" font-family="DejaVu Sans, sans-serif" font-size="60.0" font-weight="900" letter-spacing="1.5">POCKET</text>
      <text x="0" y="56.4" fill="#F4BF3A" stroke="#111827" stroke-width="2.1" paint-order="stroke" font-family="DejaVu Sans, sans-serif" font-size="60.0" font-weight="900" letter-spacing="1.1">CIRCUIT</text>
