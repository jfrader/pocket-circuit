name: Release gates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Check host capacity and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import shutil; assert shutil.disk_usage(".").free > 8 * 1024**3, "At least 8 GiB free disk is required"'
          command -v ffprobe
          command -v magick || command -v convert
      - name: Test the Godot installer retry and verify path
        run: python3 tools/test_install_ci_godot.py
      - name: Install verified Godot editor and native templates
        run: python3 tools/install_ci_godot.py "$RUNNER_TEMP/pocket-godot" >> "$GITHUB_ENV"
      - name: Full source, smoke and package gates
        env:
          PC_ROUTE_SVG: ${{ runner.temp }}/route-variety.svg
        run: |
          set -o pipefail
          ./tools/build_release.sh "$RUNNER_TEMP/pocket-release" 2>&1 | tee "$RUNNER_TEMP/release-gates.log"
      - name: Verify artifact manifest
        working-directory: ${{ runner.temp }}/pocket-release
        run: sha256sum --check SHA256SUMS
      - name: Retain verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocket-circuit-${{ github.sha }}
          path: ${{ runner.temp }}/pocket-release
          if-no-files-found: error
          retention-days: 7
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-gates.log
            ${{ runner.temp }}/route-variety.svg
          if-no-files-found: warn
          retention-days: 7
